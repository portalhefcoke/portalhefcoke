services:
  - type: web
    name: hef-portal-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hef-portal-db
          property: connectionString
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        value: https://hef-portal-backend.onrender.com/api/payment/callback
      - key: FRONTEND_URL
        value: https://hef-portal.vercel.app

databases:
  - name: hef-portal-db
    databaseName: hef_portal
    user: hef_portal_user